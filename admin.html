<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBag Remote Control</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #1e293b; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 300px; }
        h2 { color: #38bdf8; margin-bottom: 30px; }
        .switch { position: relative; display: inline-block; width: 80px; height: 40px; margin-bottom: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ef4444; transition: .4s; border-radius: 40px; }
        .slider:before { position: absolute; content: ""; height: 32px; width: 32px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(40px); }
        .status-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .btn { background: #38bdf8; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚡ لوحة تحكم SkyBag</h2>
        
        <label class="switch">
            <input type="checkbox" id="powerSwitch" checked>
            <span class="slider"></span>
        </label>
        
        <div class="status-text" id="statusText" style="color: #22c55e;">الأداة تعمل حالياً</div>
        
        <button class="btn" onclick="saveStatus()">حفظ التعديل</button>
    </div>

    <script>
        const dbUrl = "https://matrix-tool-admin-default-rtdb.firebaseio.com/systemStatus.json";
        const powerSwitch = document.getElementById('powerSwitch');
        const statusText = document.getElementById('statusText');

        // جلب الحالة الحالية من السيرفر أول ما تفتح تليفونك
        fetch(dbUrl).then(r => r.json()).then(isActive => {
            powerSwitch.checked = (isActive !== false); // لو مفيش بيانات، خليها شغالة افتراضياً
            updateText();
        });

        powerSwitch.addEventListener('change', updateText);

        function updateText() {
            if(powerSwitch.checked) {
                statusText.innerText = "🟢 الأداة تعمل حالياً";
                statusText.style.color = "#22c55e";
            } else {
                statusText.innerText = "🔴 الأداة متوقفة";
                statusText.style.color = "#ef4444";
            }
        }

        // حفظ الحالة للسيرفر
        function saveStatus() {
            fetch(dbUrl, {
                method: 'PUT',
                body: JSON.stringify(powerSwitch.checked)
            }).then(() => {
                alert("✅ تم تنفيذ الأمر بنجاح!");
            }).catch(() => {
                alert("❌ حدث خطأ، تأكد من الإنترنت.");
            });
        }
    </script>
</body>
</html>
