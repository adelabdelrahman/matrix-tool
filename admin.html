<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBag - System Administration</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #111827;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-blue: #0284c7;
            --accent-hover: #0369a1;
            --danger: #dc2626;
            --success: #16a34a;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            font-family: 'Tajawal', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px; 
            box-sizing: border-box; 
        }
        
        .dashboard-wrapper { 
            width: 100%; 
            max-width: 1100px; 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
        }
        
        /* Header */
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 10px; }
        .header-title { font-size: 28px; font-weight: 900; color: #fff; margin: 0 0 5px 0; letter-spacing: 1px; }
        .header-title span { color: var(--accent-blue); }
        .header-subtitle { font-size: 14px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px;}

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Admin Cards */
        .admin-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 25px; 
            display: flex;
            flex-direction: column;
        }
        
        .section-header { 
            font-size: 15px; 
            color: #fff; 
            font-weight: 700; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            text-transform: uppercase;
        }

        .badge-count { background: rgba(2, 132, 199, 0.2); color: var(--accent-blue); padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 900; border: 1px solid rgba(2, 132, 199, 0.3);}

        /* Master Switch */
        .switch-wrapper { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .status-indicator { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot.offline { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }

        /* Inputs & Buttons */
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #030712; color: #fff; text-align: center; font-size: 16px; font-weight: bold; font-family: monospace; box-sizing: border-box; transition: 0.3s; }
        input[type="text"]:focus { outline: none; border-color: var(--accent-blue); }
        
        .btn-primary { background: var(--accent-blue); color: white; border: none; padding: 18px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; font-family: 'Tajawal', sans-serif; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;}
        .btn-primary:hover { background: var(--accent-hover); }
        
        /* Lists */
        .flex-row { display: flex; gap: 10px; }
        .flex-row input { margin-bottom: 0; text-align: right; padding-right: 15px; font-family: 'Tajawal', sans-serif;}
        .btn-secondary { background: #1f2937; color: white; border: 1px solid #374151; padding: 0 25px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; font-family: 'Tajawal', sans-serif;}
        .btn-secondary:hover { background: #374151; }
        
        .list-container { flex: 1; min-height: 220px; max-height: 280px; overflow-y: auto; padding-right: 5px; margin-top: 15px;}
        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #030712; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--border-color); transition: 0.2s;}
        .list-item:hover { border-color: #374151; }
        
        .device-info { display: flex; flex-direction: column; text-align: left; direction: ltr; }
        .device-id { font-weight: bold; font-size: 14px; color: #e5e7eb; font-family: monospace; display: flex; align-items: center; gap: 8px;}
        .device-os { font-size: 11px; color: var(--text-secondary); margin-top: 4px;}
        
        .btn-action { border: 1px solid transparent; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: 'Tajawal', sans-serif; }
        .btn-block { background: rgba(220, 38, 38, 0.1); color: var(--danger); border-color: rgba(220, 38, 38, 0.2); }
        .btn-block:hover { background: var(--danger); color: #fff; }
        .btn-unblock { background: rgba(22, 163, 74, 0.1); color: var(--success); border-color: rgba(22, 163, 74, 0.2); }
        .btn-unblock:hover { background: var(--success); color: #fff; }
        
        .del-btn { color: var(--text-secondary); cursor: pointer; font-size: 14px; font-weight: bold; padding-left: 15px; transition: 0.2s;}
        .del-btn:hover { color: var(--danger); }
        .hol-text { font-family: monospace; font-weight: bold; font-size: 14px; color: #e5e7eb;}
        .empty-state { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 10px; }

        /* Custom System Notifications */
        .system-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #111827;
            border-left: 4px solid var(--accent-blue);
            color: #fff;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 99999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-family: 'Tajawal', sans-serif;
        }
        .system-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--danger); }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; gap: 20px;}
            .list-container { min-height: 180px; }
            .system-toast { width: 85%; }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <header>
            <h1 class="header-title">SkyBag <span>Admin</span></h1>
            <div class="header-subtitle">Matrix Tool Admin</div>
        </header>

        <main class="grid-container">
            
            <div style="display: flex; flex-direction: column; gap: 20px;">
                
                <div class="admin-card">
                    <div class="section-header">System Status</div>
                    <div class="switch-wrapper">
                        <div class="status-indicator" id="statusIndicator">
                            <span class="dot online" id="statusDot"></span>
                            <span id="statusText">System Active</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="powerSwitch" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="admin-card" style="flex: 1;">
                    <div class="section-header">
                        <span>Connected Devices</span>
                        <span class="badge-count" id="onlineCount">0</span>
                    </div>
                    <div id="activeDevicesList" class="list-container">
                        <div class="empty-state">Scanning for devices...</div>
                    </div>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                
                <div class="admin-card">
                    <div class="section-header">Security Settings</div>
                    <div class="input-group">
                        <label class="input-label">System Access Password</label>
                        <input type="text" id="passInput" value="02026">
                    </div>
                </div>

                <div class="admin-card" style="flex: 1;">
                    <div class="section-header">Holiday Management</div>
                    <div class="flex-row">
                        <input type="text" id="newHolDate" placeholder="Date (e.g. 29/1/2026)" dir="ltr">
                        <button class="btn-secondary" onclick="addAdminHol()">Add</button>
                    </div>
                    <div id="adminHolsList" class="list-container"></div>
                </div>

            </div>
        </main>

        <footer>
            <button class="btn-primary" onclick="saveStatus()">Deploy Changes to System</button>
        </footer>
    </div>

    <script>
        const dbUrl = "https://matrix-tool-admin-default-rtdb.firebaseio.com/systemStatus.json";
        const devicesUrl = "https://matrix-tool-admin-default-rtdb.firebaseio.com/activeDevices.json";
        
        const powerSwitch = document.getElementById('powerSwitch');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const passInput = document.getElementById('passInput');
        const holsListDiv = document.getElementById('adminHolsList');
        const newHolDate = document.getElementById('newHolDate');
        
        let currentHolidays = []; 
        let blockedDevices = []; 

        function showSystemToast(message, type = 'success') {
            const existing = document.getElementById('sys-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'sys-toast';
            toast.className = `system-toast ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            
            const prefix = type === 'success' ? 'SUCCESS:' : 'ERROR:';
            toast.innerHTML = `<span style="font-weight:900; opacity:0.8; font-family:monospace;">${prefix}</span> <span>${message}</span>`;
            
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        fetch(dbUrl).then(r => r.json()).then(data => {
            if(data !== null) {
                if (typeof data === 'boolean') { powerSwitch.checked = data; } 
                else {
                    powerSwitch.checked = (data.isActive !== false);
                    if(data.password) passInput.value = data.password;
                    if(data.holidays) currentHolidays = data.holidays;
                    if(data.blockedDevices) blockedDevices = data.blockedDevices;
                }
            }
            updateText();
            renderAdminHols();
        });

        powerSwitch.addEventListener('change', updateText);

        function updateText() {
            if(powerSwitch.checked) {
                statusText.innerText = "System Active";
                statusText.style.color = "#fff";
                statusDot.className = "dot online";
            } else {
                statusText.innerText = "System Offline";
                statusText.style.color = "var(--text-secondary)";
                statusDot.className = "dot offline";
            }
        }

        function fetchActiveDevices() {
            fetch(devicesUrl).then(r => r.json()).then(data => {
                let onlineCount = 0;
                let listHtml = '';
                let now = new Date().getTime();
                
                if(data) {
                    for(let id in data) {
                        let isBlocked = blockedDevices.includes(id);
                        if((now - data[id].lastSeen <= 15000) || isBlocked) { 
                            if(!isBlocked) onlineCount++;
                            
                            let dotClass = isBlocked ? "offline" : "online";
                            let btnHtml = isBlocked 
                                ? `<button class="btn-action btn-unblock" onclick="toggleBlock('${id}')">Unblock</button>`
                                : `<button class="btn-action btn-block" onclick="toggleBlock('${id}')">Block</button>`;

                            listHtml += `
                                <div class='list-item' style="${isBlocked ? 'opacity:0.5;' : ''}">
                                    <div class="device-info">
                                        <span class="device-id"><span class="dot ${dotClass}"></span> ${id}</span>
                                        <span class="device-os">${data[id].os || 'Unknown OS'}</span>
                                    </div>
                                    ${btnHtml}
                                </div>`;
                        }
                    }
                }
                
                document.getElementById('onlineCount').innerText = onlineCount;
                document.getElementById('activeDevicesList').innerHTML = listHtml || '<div class="empty-state">No active devices found.</div>';
            }).catch(()=>{});
        }
        
        setInterval(fetchActiveDevices, 3000);

        window.toggleBlock = function(id) {
            if(blockedDevices.includes(id)) {
                blockedDevices = blockedDevices.filter(d => d !== id); 
            } else {
                blockedDevices.push(id); 
            }
            saveStatus(true); 
            fetchActiveDevices(); 
        }

        function addAdminHol() {
            const val = newHolDate.value.trim();
            if(val) { currentHolidays.push(val); newHolDate.value = ''; renderAdminHols(); }
        }
        function delAdminHol(index) {
            currentHolidays.splice(index, 1); renderAdminHols();
        }
        function renderAdminHols() {
            holsListDiv.innerHTML = '';
            if(currentHolidays.length === 0) { holsListDiv.innerHTML = '<div class="empty-state">No holidays configured.</div>'; return; }
            currentHolidays.forEach((hol, i) => {
                holsListDiv.innerHTML += `
                <div class='list-item'>
                    <span class="del-btn" onclick="delAdminHol(${i})">REMOVE</span>
                    <span class="hol-text">${hol}</span>
                </div>`;
            });
        }

        function saveStatus(silent = false) {
            const config = {
                isActive: powerSwitch.checked,
                password: passInput.value,
                holidays: currentHolidays,
                blockedDevices: blockedDevices,
                adminKey: 'Adel_Matrix_2026' 
            };
            fetch(dbUrl, { method: 'PUT', body: JSON.stringify(config) })
            .then(response => {
                if(!response.ok) throw new Error("Unauthorized");
                if(!silent) showSystemToast("تم نشر التعديلات بنجاح على جميع الأجهزة!", "success"); 
            })
            .catch(() => { if(!silent) showSystemToast("تم رفض التعديل! تأكد من صلاحيات الفايربيس.", "error"); });
        }
    </script>
</body>
</html>
