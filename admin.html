<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Mat-Tool Admin</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { 
                        brand: '#0f172a',
                        brandHover: '#1e293b',
                        accent: '#2563eb',
                        accentHover: '#1d4ed8',
                        surface: '#f8fafc',
                        borderLight: '#e2e8f0',
                        success: '#059669',
                        danger: '#dc2626'
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'floating': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)'
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #0f172a; margin: 0; overflow: hidden; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box; }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-indicator { animation: pulseIndicator 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulseIndicator { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; color: #2563eb; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tooltip .tooltip-text { visibility: hidden; width: max-content; background-color: #0f172a; color: #fff; text-align: center; border-radius: 6px; padding: 6px 12px; position: absolute; z-index: 50; top: 50%; left: 110%; transform: translateY(-50%); opacity: 0; transition: opacity 0.2s; font-size: 12px; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); pointer-events: none; }
        @media (min-width: 768px) { .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useDeferredValue } = React;

        const ADMIN_PANEL_PASSWORD = "0282003";
        const BASE_URL = "https://matrix-tool-admin-default-rtdb.firebaseio.com";

        // Existing Firebase permission arrays. These names are intentionally unchanged.
        const USER_PERMISSION_FIELDS = [
            'podUsers', 'wafaUsers', 'bankUsers', 'returnsUsers',
            'addBillUsers', 'drsAlertUsers', 'autoPilotUsers', 'forceEditUsers', 'manifestUsers', 'managePodDateUsers'
        ];
        const DATA_PERMISSION_FIELDS = ['podUsers', 'wafaUsers', 'bankUsers', 'returnsUsers'];

        const PermissionSwitch = ({ label, description, checked, onChange, grantedCount = 0, totalCount = 1 }) => {
            const partial = grantedCount > 0 && grantedCount < totalCount;
            return (
                <div className="flex items-center justify-between gap-4 rounded-lg border border-slate-200 bg-white px-3 py-3 hover:border-slate-300 transition-colors">
                    <span className="min-w-0">
                        <span className="block text-sm font-semibold text-slate-800">{label}</span>
                        {description && <span className="block text-[11px] text-slate-500 mt-0.5">{description}</span>}
                        {partial && <span className="mt-1 inline-flex items-center gap-2 text-[10px] font-bold text-amber-700">Partial access · {grantedCount}/{totalCount} devices <button type="button" onClick={() => onChange(false)} className="underline decoration-dotted hover:text-red-700">Revoke all</button></span>}
                    </span>
                    <label className="relative inline-flex shrink-0 items-center cursor-pointer" title={partial ? 'Enable for all devices' : (checked ? 'Enabled on all devices' : 'Disabled on all devices')}>
                        <input type="checkbox" className="peer sr-only" checked={!!checked} onChange={e => onChange(e.target.checked)} />
                        <span className="h-6 w-11 rounded-full bg-slate-200 transition-colors peer-checked:bg-emerald-600"></span>
                        <span className="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
                    </label>
                </div>
            );
        };

        // Group real Firebase device records by the registered username. Records without
        // a username stay separate so unrelated/unknown devices are never merged.
        const buildUserGroups = (deviceData, config = {}) => {
            const blockedIds = new Set(Array.isArray(config.blockedDevices) ? config.blockedDevices : []);
            const now = Date.now();
            const buckets = new Map();
            Object.entries(deviceData || {}).forEach(([id, record]) => {
                if (!String(id || '').trim() || !record || typeof record !== 'object' || Array.isArray(record)) return;
                const displayName = String(record.user || '').replace(/\s+/g, ' ').trim();
                const normalizedName = displayName.toLocaleLowerCase();
                const key = normalizedName ? `user:${normalizedName}` : `device:${id}`;
                if (!buckets.has(key)) buckets.set(key, { key, user: displayName || 'No username recorded', devices: [] });
                buckets.get(key).devices.push({ id: String(id), ...record });
            });
            return Array.from(buckets.values()).map(group => {
                const sorted = [...group.devices].sort((a, b) => Number(b.lastSeen || 0) - Number(a.lastSeen || 0));
                const onlineDevices = sorted.filter(d => Number(d.lastSeen || 0) > 0 && (now - Number(d.lastSeen || 0)) < 15000 && !blockedIds.has(d.id));
                const blockedCount = group.devices.filter(d => blockedIds.has(d.id)).length;
                return {
                    ...group,
                    deviceIds: group.devices.map(d => d.id),
                    onlineDevices,
                    onlineCount: onlineDevices.length,
                    isOnline: onlineDevices.length > 0,
                    blockedCount,
                    someBlocked: blockedCount > 0,
                    allBlocked: group.devices.length > 0 && blockedCount === group.devices.length,
                    primaryDevice: onlineDevices[0] || sorted[0]
                };
            }).sort((a, b) => (Number(b.isOnline) - Number(a.isOnline)) || a.user.localeCompare(b.user));
        };

        const Icons = {
            Shield: () => <svg className="w-6 h-6 sm:w-7 sm:h-7 text-accent shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>,
            Activity: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>,
            Table: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>,
            Settings: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Server: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>,
            Calendar: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
            Search: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            Download: () => <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>,
            Lock: () => <svg className="w-16 h-16 text-slate-300 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>,
            X: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            ChevronLeft: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>,
            ChevronRight: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>,
            Menu: () => <svg className="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>,
            Chat: () => <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>,
            Trash: () => <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Robot: () => <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        };

        const ToastAlert = ({ msg, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
            const isError = type === 'error';
            return (
                <div className={`fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-floating flex items-center gap-3 font-semibold text-sm z-[99999] fade-in border bg-white ${isError ? 'text-danger border-red-200 border-l-4 border-l-danger' : 'text-slate-800 border-borderLight border-l-4 border-l-accent'}`}>
                    {msg}
                </div>
            );
        };

        const GlobalLoader = ({ show }) => {
            if(!show) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999999] flex flex-col justify-center items-center fade-in">
                    <div className="spinner"></div>
                    <div className="mt-4 text-white font-bold text-sm tracking-widest uppercase shadow-sm">Processing...</div>
                </div>
            )
        };

        const App = () => {
            const todayLocal = new Date();
            const yyyy = todayLocal.getFullYear();
            const mm = String(todayLocal.getMonth() + 1).padStart(2, '0');
            const dd = String(todayLocal.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;

            const [isAuth, setIsAuth] = useState(() => localStorage.getItem('mat_admin_auth') === 'true');
            const [loginKey, setLoginKey] = useState('');
            const [activeView, setActiveView] = useState('monitoring');
            const [toast, setToast] = useState(null);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => window.innerWidth < 768);
            const [isLoading, setIsLoading] = useState(false);

            const [devices, setDevices] = useState({});
            const [logs, setLogs] = useState({});
            const [messages, setMessages] = useState({});
            
            // 🛑 تحديث حالة الـ Config لإضافة forceEditUsers 🛑
            const [systemConfig, setSystemConfig] = useState({ isActive: true, password: '0282003', blockedDevices: [], accDb: {}, holidays: [], autoPilotUsers: [], forceEditUsers: [], addBillUsers: [], drsAlertUsers: [], podUsers: [], wafaUsers: [], bankUsers: [], returnsUsers: [], manifestUsers: [], managePodDateUsers: [], modeAccessEnabled: false, modeAccessInitialized: false });
            const [passcodeDraft, setPasscodeDraft] = useState('0282003');
const passcodeDirtyRef = useRef(false);
const passcodeEditVersionRef = useRef(0);
            const [isOnline, setIsOnline] = useState(true);

            // Audit Logs Filters
            const [searchUserAwb, setSearchUserAwb] = useState('');
            const [searchAccNo, setSearchAccNo] = useState('');
            const [showApOnly, setShowApOnly] = useState(false);
            const deferredUserAwb = useDeferredValue(searchUserAwb);
            const deferredAccNo = useDeferredValue(searchAccNo);
            const [logFrom, setLogFrom] = useState(todayStr);
            const [logTo, setLogTo] = useState(todayStr);
            
            const [dbPass, setDbPass] = useState('');
            const [isDbUnlocked, setIsDbUnlocked] = useState(false);
            
            const [localAccDb, setLocalAccDb] = useState({});
            const [fAccNo, setFAccNo] = useState('');
            const [fName, setFName] = useState('');
            const [fType, setFType] = useState('Courier'); 
            const [fLogic, setFLogic] = useState('default');
            const [fDays, setFDays] = useState('');
            const [dbSearch, setDbSearch] = useState('');

            const [calDate, setCalDate] = useState(new Date());

            const [chatModal, setChatModal] = useState({ isOpen: false, targetId: '', targetName: '', text: '' });
            const chatBoxRef = useRef(null);
            const [selectedPermissionUser, setSelectedPermissionUser] = useState('');
            const [permissionSearch, setPermissionSearch] = useState('');
            const [permissionDraft, setPermissionDraft] = useState({});
            const [permissionDirty, setPermissionDirty] = useState(false);
            const [permissionTouchedFields, setPermissionTouchedFields] = useState({});

            const showToast = (msg, type='success') => setToast({msg, type});

            const fetchEngine = async () => {
                const passcodeFetchVersion = passcodeEditVersionRef.current;
                try {
                    const [devRes, configRes, msgRes] = await Promise.all([
                        fetch(`${BASE_URL}/activeDevices.json`),
                        fetch(`${BASE_URL}/systemStatus.json`),
                        fetch(`${BASE_URL}/systemStatus/messages.json`)
                    ]);
                    
                    const devData = await devRes.json();
                    const configData = await configRes.json();
                    const msgData = await msgRes.json();

                    setDevices(devData || {});
                    setMessages(msgData || {});
                    
                    if (configData) {
                        setSystemConfig({
                            isActive: configData.isActive !== false,
                            password: configData.password || '0282003',
                            blockedDevices: configData.blockedDevices || [],
                            accDb: configData.accDb || {},
                            holidays: configData.holidays || [],
                            autoPilotUsers: configData.autoPilotUsers || [],
                            forceEditUsers: configData.forceEditUsers || [],
                            addBillUsers: configData.addBillUsers || [],
                            drsAlertUsers: configData.drsAlertUsers || [],
                            manifestUsers: Array.isArray(configData.manifestUsers) ? configData.manifestUsers : [],
                            managePodDateUsers: Array.isArray(configData.managePodDateUsers) ? configData.managePodDateUsers : [],
                            podUsers: configData.podUsers || [],
                            wafaUsers: configData.wafaUsers || [],
                            bankUsers: configData.bankUsers || [],
                            returnsUsers: configData.returnsUsers || [],
                            modeAccessEnabled: configData.modeAccessEnabled === true,
                            modeAccessInitialized: configData.modeAccessInitialized === true
                        });
                        if (!passcodeDirtyRef.current && passcodeEditVersionRef.current === passcodeFetchVersion) {
    setPasscodeDraft(configData.password || '0282003');
}
                    }
                    setIsOnline(true);
                } catch (err) { setIsOnline(false); }
            };

            const fetchAuditLogs = async () => {
                try {
                    const res = await fetch(`${BASE_URL}/masterLogs.json`);
                    const data = await res.json();
                    setLogs(data || {});
                } catch (err) { showToast("Failed to retrieve audit logs", "error"); }
            };

            useEffect(() => {
                if(isAuth) {
                    fetchEngine();
                    const ticker = setInterval(fetchEngine, 1000); 
                    return () => clearInterval(ticker);
                }
            }, [isAuth]);

            useEffect(() => { if (activeView === 'logs') fetchAuditLogs(); }, [activeView]);

            const handleAuth = () => {
                setIsLoading(true);
                setTimeout(() => {
                    if(loginKey === ADMIN_PANEL_PASSWORD) {
                        localStorage.setItem('mat_admin_auth', 'true');
                        setIsAuth(true);
                    } else {
                        showToast("Authentication Denied", "error");
                    }
                    setIsLoading(false);
                }, 500);
            };

            const deployConfig = async (partialConfig) => {
                setIsLoading(true);
                const newConfig = { ...systemConfig, ...partialConfig };
                let parsedDb = newConfig.accDb;

                let deployed = false;
                try {
                    await fetch(BASE_URL + '/systemStatus.json', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            isActive: newConfig.isActive,
                            password: newConfig.password,
                            blockedDevices: newConfig.blockedDevices,
                            accDb: parsedDb,
                            holidays: newConfig.holidays.map(d => d.replace(/\/+/g, '/').trim()).filter(Boolean),
                            autoPilotUsers: newConfig.autoPilotUsers || [],
                            forceEditUsers: newConfig.forceEditUsers || [],
                            addBillUsers: newConfig.addBillUsers || [],
                            drsAlertUsers: newConfig.drsAlertUsers || [],
                            manifestUsers: newConfig.manifestUsers || [],
                            managePodDateUsers: newConfig.managePodDateUsers || [],
                            podUsers: newConfig.podUsers || [],
                            wafaUsers: newConfig.wafaUsers || [],
                            bankUsers: newConfig.bankUsers || [],
                            returnsUsers: newConfig.returnsUsers || [],
                            modeAccessEnabled: newConfig.modeAccessEnabled === true,
                            modeAccessInitialized: newConfig.modeAccessInitialized === true
                        })
                    });
                    setSystemConfig(newConfig);
                    showToast("System Configuration Deployed!", "success");
                    deployed = true;
                } catch(e) { showToast("Deployment failed", "error"); }
                setIsLoading(false);
                return deployed;
            };

            const toggleDeviceBlock = (id) => {
                let blocks = [...systemConfig.blockedDevices];
                if(blocks.includes(id)) blocks = blocks.filter(b => b !== id); else blocks.push(id);
                deployConfig({ blockedDevices: blocks });
            };

            const toggleAutoPilot = (id) => {
                let apUsers = [...(systemConfig.autoPilotUsers || [])];
                if(apUsers.includes(id)) apUsers = apUsers.filter(u => u !== id); else apUsers.push(id);
                deployConfig({ autoPilotUsers: apUsers });
                showToast(apUsers.includes(id) ? "Auto-Pilot Enabled for Agent" : "Auto-Pilot Disabled", "success");
            };

            // 🛑 التحكم في زر فتح الـ Delivered 🛑
            const toggleForceEdit = (id) => {
                let forceUsers = [...(systemConfig.forceEditUsers || [])];
                if(forceUsers.includes(id)) forceUsers = forceUsers.filter(u => u !== id); else forceUsers.push(id);
                deployConfig({ forceEditUsers: forceUsers });
                showToast(forceUsers.includes(id) ? "Delivered Edit Enabled" : "Delivered Edit Disabled", "success");
            };

            // Independent access control for the Add Bill UI extension
            const toggleAddBill = (id) => {
                let users = [...(systemConfig.addBillUsers || [])];
                const granting = !users.includes(id);
                users = granting ? [...users, id] : users.filter(u => u !== id);
                deployConfig({ addBillUsers: users });
                showToast(granting ? "Add Bill access granted" : "Add Bill access revoked", "success");
            };

            // Independent access control for the DRS Shipment Alert module
            const toggleDrsAlert = (id) => {
                let users = [...(systemConfig.drsAlertUsers || [])];
                const granting = !users.includes(id);
                users = granting ? [...users, id] : users.filter(u => u !== id);
                deployConfig({ drsAlertUsers: users });
                showToast(granting ? "DRS Alert access granted" : "DRS Alert access revoked", "success");
            };

            const MODE_ACCESS_FIELDS = ['podUsers', 'wafaUsers', 'bankUsers', 'returnsUsers'];

            // During first rollout, preserve legacy access for known devices wherever a
            // mode has not been configured yet. Once initialized, empty lists mean no grants.
            const buildSafeModeInitialization = (extraDeviceId = '') => {
                const knownIds = Array.from(new Set([
                    ...Object.keys(devices || {}),
                    ...(extraDeviceId ? [String(extraDeviceId)] : [])
                ].map(v => String(v || '').trim()).filter(Boolean)));
                const partial = {};
                MODE_ACCESS_FIELDS.forEach(field => {
                    const current = Array.isArray(systemConfig[field]) ? [...systemConfig[field]] : [];
                    partial[field] = (!systemConfig.modeAccessInitialized && current.length === 0)
                        ? [...knownIds]
                        : current;
                });
                partial.modeAccessInitialized = true;
                return partial;
            };

            const handleModeAccessEnforcementToggle = (enabled) => {
                if (!enabled) {
                    deployConfig({ modeAccessEnabled: false });
                    return;
                }
                const partial = systemConfig.modeAccessInitialized ? {} : buildSafeModeInitialization();
                partial.modeAccessEnabled = true;
                partial.modeAccessInitialized = true;
                deployConfig(partial);
                showToast('Mode access enforcement enabled. Existing known-device access was preserved where no mode grants had been configured.', 'success');
            };

            const toggleModeAccess = (field, id) => {
                const labels = { podUsers: 'POD', wafaUsers: 'Wafa', bankUsers: 'Bank', returnsUsers: 'Returns' };
                if (!Object.prototype.hasOwnProperty.call(labels, field)) return;
                const current = Array.isArray(systemConfig[field]) ? [...systemConfig[field]] : [];
                const granting = !current.includes(id);
                // First grant/revoke also turns enforcement on. Seed empty, not-yet-configured
                // mode lists with existing devices so colleagues are not unexpectedly locked out.
                const partial = systemConfig.modeAccessInitialized ? {} : buildSafeModeInitialization(id);
                const effective = Array.isArray(partial[field]) ? [...partial[field]] : [...current];
                partial[field] = granting
                    ? (effective.includes(id) ? effective : [...effective, id])
                    : effective.filter(u => u !== id);
                partial.modeAccessInitialized = true;
                if (systemConfig.modeAccessEnabled !== true) partial.modeAccessEnabled = true;
                deployConfig(partial);
                showToast(`${labels[field]} access ${granting ? 'granted' : 'revoked'}${systemConfig.modeAccessEnabled ? '' : ' · mode enforcement enabled'}`, 'success');
            };

            const getPermissionDraft = (deviceIds, config = systemConfig) => {
                const ids = Array.isArray(deviceIds) ? deviceIds : [deviceIds];
                const draft = {};
                USER_PERMISSION_FIELDS.forEach(field => {
                    const grants = Array.isArray(config[field]) ? config[field] : [];
                    draft[field] = ids.length > 0 && ids.every(id => grants.includes(id));
                });
                return draft;
            };

            const getPermissionGrantCount = (field, deviceIds) => {
                const ids = Array.isArray(deviceIds) ? deviceIds : [];
                const grants = Array.isArray(systemConfig[field]) ? systemConfig[field] : [];
                return ids.filter(id => grants.includes(id)).length;
            };

            const selectPermissionUser = (groupKey) => {
                const group = buildUserGroups(devices, systemConfig).find(item => item.key === groupKey);
                if (!group || groupKey === selectedPermissionUser) return;
                if (permissionDirty && !window.confirm('Discard unsaved permission changes for the current user?')) return;
                setSelectedPermissionUser(group.key);
                setPermissionDraft(getPermissionDraft(group.deviceIds));
                setPermissionTouchedFields({});
                setPermissionDirty(false);
            };

            const openUserManager = (group) => {
                if (!group || !group.deviceIds || !group.deviceIds.length) return;
                if (permissionDirty && !window.confirm('Discard unsaved permission changes for the current user?')) return;
                setSelectedPermissionUser(group.key);
                setPermissionDraft(getPermissionDraft(group.deviceIds));
                setPermissionTouchedFields({});
                setPermissionDirty(false);
                setActiveView('permissions');
            };

            const updatePermissionDraft = (field, enabled) => {
                if (!USER_PERMISSION_FIELDS.includes(field)) return;
                setPermissionDraft(prev => ({ ...prev, [field]: !!enabled }));
                setPermissionTouchedFields(prev => ({ ...prev, [field]: true }));
                setPermissionDirty(true);
            };

            const saveSelectedPermissions = async () => {
                const group = buildUserGroups(devices, systemConfig).find(item => item.key === selectedPermissionUser);
                const ids = group ? group.deviceIds : [];
                if (!ids.length || ids.some(id => !Object.prototype.hasOwnProperty.call(devices || {}, id))) {
                    showToast('Select a registered user before saving permissions.', 'error');
                    return;
                }

                const partial = {};
                const dataTouched = DATA_PERMISSION_FIELDS.some(field => !!permissionTouchedFields[field]);

                // Keep the original first-use safety behavior. Existing device grants are
                // seeded only when a DATA permission is explicitly edited for the first time.
                if (dataTouched) {
                    const safeSeed = systemConfig.modeAccessInitialized ? {} : buildSafeModeInitialization();
                    DATA_PERMISSION_FIELDS.forEach(field => {
                        const current = Array.isArray(systemConfig[field]) ? [...systemConfig[field]] : [];
                        const hasSafeSeed = Array.isArray(safeSeed[field]);
                        const next = hasSafeSeed ? [...safeSeed[field]] : current;
                        if (permissionTouchedFields[field]) {
                            ids.forEach(id => {
                                const exists = next.includes(id);
                                if (permissionDraft[field] && !exists) next.push(id);
                                if (!permissionDraft[field] && exists) {
                                    for (let i = next.length - 1; i >= 0; i--) if (next[i] === id) next.splice(i, 1);
                                }
                            });
                            partial[field] = next;
                        } else if (hasSafeSeed) {
                            partial[field] = next;
                        }
                    });
                    partial.modeAccessInitialized = true;
                    if (systemConfig.modeAccessEnabled !== true) partial.modeAccessEnabled = true;
                }

                ['addBillUsers', 'drsAlertUsers', 'autoPilotUsers', 'forceEditUsers', 'manifestUsers', 'managePodDateUsers'].forEach(field => {
                    if (!permissionTouchedFields[field]) return;
                    const next = Array.isArray(systemConfig[field]) ? [...systemConfig[field]] : [];
                    ids.forEach(id => {
                        const exists = next.includes(id);
                        if (permissionDraft[field] && !exists) next.push(id);
                        if (!permissionDraft[field] && exists) {
                            for (let i = next.length - 1; i >= 0; i--) if (next[i] === id) next.splice(i, 1);
                        }
                    });
                    partial[field] = next;
                });

                if (Object.keys(partial).length === 0) {
                    setPermissionDirty(false);
                    setPermissionTouchedFields({});
                    showToast('No permission changes to save.', 'success');
                    return;
                }

                const deployed = await deployConfig(partial);
                if (deployed) {
                    const updatedConfig = { ...systemConfig, ...partial };
                    setPermissionDraft(getPermissionDraft(ids, updatedConfig));
                    setPermissionTouchedFields({});
                    setPermissionDirty(false);
                }
            };

            useEffect(() => {
                if (activeView !== 'permissions' || selectedPermissionUser) return;
                const firstGroup = buildUserGroups(devices, systemConfig)[0];
                if (!firstGroup) return;
                setSelectedPermissionUser(firstGroup.key);
                setPermissionDraft(getPermissionDraft(firstGroup.deviceIds));
                setPermissionTouchedFields({});
                setPermissionDirty(false);
            }, [activeView, devices, selectedPermissionUser, systemConfig]);

            const toggleUserBlock = (deviceIds) => {
                const ids = Array.isArray(deviceIds) ? deviceIds : [];
                if (!ids.length) return;
                const current = Array.isArray(systemConfig.blockedDevices) ? [...systemConfig.blockedDevices] : [];
                const allBlocked = ids.every(id => current.includes(id));
                let next = current;
                ids.forEach(id => {
                    const exists = next.includes(id);
                    if (allBlocked && exists) next = next.filter(value => value !== id);
                    if (!allBlocked && !exists) next = [...next, id];
                });
                deployConfig({ blockedDevices: next });
                showToast(allBlocked ? 'User unblocked on all registered devices' : 'User blocked on all registered devices', 'success');
            };

            useEffect(() => {
                if (activeView !== 'permissions' || !selectedPermissionUser) return;
                const exists = buildUserGroups(devices, systemConfig).some(group => group.key === selectedPermissionUser);
                if (!exists && !permissionDirty) {
                    setSelectedPermissionUser('');
                    setPermissionDraft({});
                    setPermissionTouchedFields({});
                }
            }, [activeView, devices, selectedPermissionUser, permissionDirty, systemConfig]);

            const openChat = (id, name) => {
                setChatModal({ isOpen: true, targetId: id, targetName: name, text: '' });
                setTimeout(() => { if(chatBoxRef.current) chatBoxRef.current.scrollTop = chatBoxRef.current.scrollHeight; }, 100);
            };

            const sendDirectMessage = async () => {
                if(!chatModal.text.trim() || !chatModal.targetId) return;
                setIsLoading(true);
                const targetData = messages[chatModal.targetId] || {};
                const chatArr = targetData.chat || [];
                chatArr.push({ from: 'admin', msg: chatModal.text.trim(), ts: Date.now() });
                
                await fetch(`${BASE_URL}/systemStatus/messages/${chatModal.targetId}.json`, {
                    method: 'PUT', body: JSON.stringify({ chat: chatArr, adminKey: 'Adel_Matrix_2026' })
                });
                setChatModal(prev => ({...prev, text: ''}));
                setIsLoading(false);
                setTimeout(() => { if(chatBoxRef.current) chatBoxRef.current.scrollTop = chatBoxRef.current.scrollHeight; }, 100);
            };

            const clearChatHistory = async () => {
                if(confirm("Are you sure you want to end and clear this chat history?")) {
                    setIsLoading(true);
                    try {
                        await fetch(`${BASE_URL}/systemStatus/messages/${chatModal.targetId}.json`, { method: 'DELETE' });
                        setMessages(prev => ({...prev, [chatModal.targetId]: { chat: [] }}));
                        showToast("Chat cleared", "success");
                    } catch(e) {
                        showToast("Error clearing chat", "error");
                    }
                    setIsLoading(false);
                }
            };

            const dateToNumeric = (str, isIso) => {
                if(!str) return 0;
                const parts = isIso ? str.split('-') : str.split('/');
                if(parts.length === 3) {
                    const y = isIso ? parseInt(parts[0]) : parseInt(parts[2]);
                    const m = parseInt(parts[1]);
                    const d = isIso ? parseInt(parts[2]) : parseInt(parts[0]);
                    return y * 10000 + m * 100 + d;
                }
                return 0;
            };

            const processedLogs = useMemo(() => {
                const fVal = dateToNumeric(logFrom, true);
                const tVal = dateToNumeric(logTo, true);
                const qUserAwb = deferredUserAwb.trim().toLowerCase();
                const qAccNo = deferredAccNo.trim().toLowerCase();
                
                const entries = Object.values(logs).filter(l => l && typeof l === 'object');
                entries.sort((a,b) => (b.ts||0) - (a.ts||0));
                
                return entries.filter(log => {
                    if(showApOnly && !log.isAutoPilot) return false;

                    if(qUserAwb) {
                        const matchUser = (log.user||'').toLowerCase().includes(qUserAwb);
                        const matchAwb = (log.awb||'').toLowerCase().includes(qUserAwb);
                        if(!matchUser && !matchAwb) return false;
                    }
                    if(qAccNo) {
                        const matchAcc = (log.accNo||'').toLowerCase().includes(qAccNo);
                        if(!matchAcc) return false;
                    }
                    
                    let lVal = dateToNumeric(log.date, false);
                    if(lVal === 0) return true;
                    if(fVal && tVal) return lVal >= fVal && lVal <= tVal;
                    if(fVal) return lVal >= fVal;
                    if(tVal) return lVal <= tVal;
                    return true;
                });
            }, [logs, logFrom, logTo, deferredUserAwb, deferredAccNo, showApOnly]);

            const showAllLogs = () => {
                setLogFrom('');
                setLogTo('');
                setSearchUserAwb('');
                setSearchAccNo('');
                setShowApOnly(false);
            };

            const escapeCSV = (val) => {
                if (val === null || val === undefined || String(val).trim() === '') return '"-"';
                return '"' + String(val).replace(/"/g, '""') + '"';
            };

            const exportAuditCSV = () => {
                setIsLoading(true);
                setTimeout(() => {
                    const dataToExport = processedLogs;
                    
                    if(dataToExport.length === 0) { 
                        showToast("No records available to export", "error"); 
                        setIsLoading(false); 
                        return; 
                    }
                    
                    let csv = "\uFEFFDate,Time,Agent Name,AWB Num,Mode,Account Name,Customer Name,ID.No,Acc.No,Status,Method\n";
                    
                    dataToExport.forEach(l => { 
                        csv += [
                            escapeCSV(l.date), 
                            escapeCSV(l.time), 
                            escapeCSV(l.user), 
                            escapeCSV(l.awb), 
                            escapeCSV(l.mode), 
                            escapeCSV(l.company), 
                            escapeCSV(l.customerName), 
                            escapeCSV(l.idNo), 
                            escapeCSV(l.accNo), 
                            escapeCSV(l.status || 'CLOSED'),
                            escapeCSV(l.isAutoPilot ? 'Robot' : 'Manual')
                        ].join(",") + "\n";
                    });
                    
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a"); 
                    link.href = URL.createObjectURL(blob);
                    
                    link.download = `Mat-Tool_Audit_${showApOnly ? 'Robot' : 'All'}.csv`; 
                    link.click();
                    setIsLoading(false);
                }, 100);
            };

            const toggleDateExclusion = (dateStr) => {
                let hols = [...systemConfig.holidays];
                const p = dateStr.split('/');
                const padStr = `${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}`;
                if(hols.includes(dateStr)) hols = hols.filter(h => h !== dateStr);
                else if(hols.includes(padStr)) hols = hols.filter(h => h !== padStr);
                else hols.push(dateStr);
                deployConfig({ holidays: hols });
            };

            const handleAddDbRule = () => {
                if(!fAccNo.trim() || !fName.trim()) {
                    showToast("⚠️ Account Number and Company Name are required!", "error");
                    return;
                }
                const rule = { n: fName.trim() };
                if (fType) rule.p = fType; 
                if (fLogic === 'sameday') rule.sd = true;
                if (fLogic === 'plusdays') {
                    if(!fDays || isNaN(fDays)) {
                        showToast("⚠️ Please specify the number of days to add!", "error");
                        return;
                    }
                    rule.pd = parseInt(fDays) || 0;
                }

                setLocalAccDb(prev => ({...prev, [fAccNo.trim()]: rule}));
                showToast(`✅ Rule for Account [${fAccNo.trim()}] Added/Updated!`, "success");
                setFAccNo(''); setFName(''); setFType('Courier'); setFLogic('default'); setFDays('');
            };

            const handleDeleteDbRule = (acc) => {
                if(confirm(`⚠️ Are you sure you want to completely delete the rule for Account [${acc}]?`)) {
                    setLocalAccDb(prev => {
                        const copy = {...prev};
                        delete copy[acc];
                        return copy;
                    });
                    showToast(`🗑️ Account [${acc}] deleted successfully!`, "success");
                }
            };

            // 🛑 حل مشكلة الباسورد (مقارنة بالباسورد الأساسي الصحيح) 🛑
            const handleUnlockDb = () => {
                if(dbPass === ADMIN_PANEL_PASSWORD) {
                    setLocalAccDb(systemConfig.accDb || {});
                    setIsDbUnlocked(true); 
                    showToast("Vault Unlocked Successfully", "success");
                } else {
                    showToast("⚠️ Access Denied: Incorrect Password", "error"); 
                }
            };

            const filteredLocalDb = useMemo(() => {
                const q = dbSearch.trim().toLowerCase();
                if(!q) return Object.entries(localAccDb);
                return Object.entries(localAccDb).filter(([acc, rule]) => {
                    return acc.toLowerCase().includes(q) || (rule.n && rule.n.toLowerCase().includes(q));
                });
            }, [localAccDb, dbSearch]);

            if (!isAuth) {
                return (
                    <div className="min-h-screen bg-surface flex flex-col justify-center items-center px-4">
                        <GlobalLoader show={isLoading} />
                        <div className="bg-white p-6 sm:p-12 rounded-2xl shadow-card border border-borderLight w-full max-w-md text-center fade-in">
                            <div className="flex justify-center mb-6"><Icons.Shield /></div>
                            <h1 className="text-xl sm:text-2xl font-extrabold text-brand mb-2 tracking-tight">Mat-Tool Admin</h1>
                            <p className="text-xs sm:text-sm text-slate-500 mb-8 font-medium">Enterprise Management Console</p>
                            <input 
                                type="password" value={loginKey} onChange={e=>setLoginKey(e.target.value)} onKeyDown={e=>{if(e.key==='Enter') handleAuth()}}
                                className="w-full bg-surface border border-borderLight rounded-xl px-4 py-3.5 text-center text-lg sm:text-xl tracking-[0.5em] text-brand font-bold mb-6 focus:outline-none focus:border-accent focus:bg-white transition-all shadow-inner-light"
                                placeholder="••••••••" autoFocus
                            />
                            <button onClick={handleAuth} className="w-full bg-brand hover:bg-brandHover text-white font-bold py-3.5 rounded-xl transition-all shadow-md transform hover:-translate-y-0.5 text-sm sm:text-base">
                                Verify Access
                            </button>
                        </div>
                        {toast && <ToastAlert msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}
                    </div>
                );
            }

            const activeDeviceList = Object.entries(devices || {}).filter(([id, d]) => !!String(id || '').trim() && d && typeof d === 'object' && !Array.isArray(d)).map(([id, d]) => ({id, ...d}));
            const onlineDevices = activeDeviceList.filter(d => (Date.now() - d.lastSeen) < 15000 && !systemConfig.blockedDevices.includes(d.id));
            const permissionUserGroups = buildUserGroups(devices, systemConfig);
            const visibleUserGroups = permissionUserGroups.filter(group => group.isOnline || group.someBlocked);
            const onlineUserCount = permissionUserGroups.filter(group => group.isOnline).length;
            const selectedPermissionGroup = permissionUserGroups.find(group => group.key === selectedPermissionUser) || null;
            
            const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
            const totalClosedTodayOnly = activeDeviceList
                .filter(d => (d.lastSeen || 0) >= startOfDay.getTime())
                .reduce((sum, d) => sum + parseInt(d.count||0), 0);

            const displayLogs = processedLogs.slice(0, 1000);

            const ViewMenu = [
                { id: 'monitoring', label: 'Live Monitoring', icon: Icons.Activity },
                { id: 'permissions', label: 'User Permissions', icon: Icons.Shield },
                { id: 'logs', label: 'Master Audit Logs', icon: Icons.Table },
                { id: 'security', label: 'Security Settings', icon: Icons.Settings },
                { id: 'database', label: 'Accounts Database', icon: Icons.Server },
                { id: 'holidays', label: 'Skipped Dates', icon: Icons.Calendar },
            ];

            return (
                <div className="flex h-screen bg-surface overflow-hidden">
                    <GlobalLoader show={isLoading} />
                    
                    {!isSidebarCollapsed && (
                        <div className="fixed inset-0 bg-slate-900/50 z-30 md:hidden fade-in" onClick={() => setIsSidebarCollapsed(true)}></div>
                    )}

                    <aside className={`fixed md:relative top-0 left-0 h-full bg-white border-r border-borderLight flex flex-col z-40 shadow-2xl md:shadow-sm shrink-0 transition-all duration-300 ease-in-out ${isSidebarCollapsed ? '-translate-x-full md:translate-x-0 md:w-[80px]' : 'translate-x-0 w-[260px]'}`}>
                        <div className={`h-16 flex items-center ${isSidebarCollapsed ? 'justify-center px-0' : 'px-6'} border-b border-borderLight shrink-0 overflow-hidden`}>
                            {isSidebarCollapsed ? (
                                <div className="text-accent cursor-pointer hidden md:block" onClick={()=>setIsSidebarCollapsed(false)}><Icons.Shield /></div>
                            ) : (
                                <div className="flex items-center gap-3 font-extrabold text-brand text-lg w-full whitespace-nowrap">
                                    <Icons.Shield /> <span className="tracking-tight mt-0.5">Mat-Tool Admin</span>
                                </div>
                            )}
                        </div>
                        
                        <nav className="flex-1 py-6 px-3 flex flex-col gap-2 overflow-y-auto overflow-x-hidden">
                            {!isSidebarCollapsed && <div className="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2 px-3 fade-in">System Views</div>}
                            
                            {ViewMenu.map(view => (
                                <button 
                                    key={view.id} 
                                    onClick={() => {
                                        setActiveView(view.id);
                                        if (window.innerWidth < 768) setIsSidebarCollapsed(true);
                                    }} 
                                    className={`relative tooltip flex items-center ${isSidebarCollapsed ? 'justify-center' : 'gap-3 px-3'} py-3 rounded-xl font-semibold text-sm transition-all group ${activeView === view.id ? 'bg-blue-50 text-accent shadow-inner-light' : 'text-slate-500 hover:bg-slate-50 hover:text-brand'}`}
                                >
                                    <span className={`${activeView === view.id ? 'text-accent' : 'text-slate-400 group-hover:text-accent'} transition-colors`}><view.icon /></span>
                                    {!isSidebarCollapsed && <span className="whitespace-nowrap fade-in">{view.label}</span>}
                                    {isSidebarCollapsed && <span className="tooltip-text hidden md:block">{view.label}</span>}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 bg-surface relative">
                        <header className="h-16 bg-white border-b border-borderLight px-4 sm:px-8 flex justify-between items-center shrink-0 glass-panel z-10 sticky top-0 transition-all shadow-sm">
                            <div className="flex items-center gap-3 sm:gap-4">
                                <button onClick={()=>setIsSidebarCollapsed(!isSidebarCollapsed)} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors tooltip relative">
                                    <Icons.Menu />
                                    <span className="tooltip-text ml-4 mt-8 hidden md:block">Toggle Sidebar</span>
                                </button>
                                <h2 className="text-lg sm:text-xl font-extrabold text-brand tracking-tight truncate max-w-[150px] sm:max-w-none">
                                    {ViewMenu.find(v=>v.id===activeView)?.label}
                                </h2>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="text-[10px] sm:text-xs font-mono text-slate-500 font-medium hidden md:block">Last Sync: {new Date().toLocaleTimeString()}</div>
                                <div className={`px-2 sm:px-3 py-1.5 rounded-md flex items-center gap-1.5 sm:gap-2 text-[10px] sm:text-xs font-bold border ${isOnline ? 'bg-green-50 text-success border-green-200' : 'bg-red-50 text-danger border-red-200'}`}>
                                    <div className={`w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full ${isOnline ? 'bg-success pulse-indicator' : 'bg-danger'}`}></div>
                                    <span className="hidden sm:inline">{isOnline ? 'System Online' : 'Connection Lost'}</span>
                                    <span className="sm:hidden">{isOnline ? 'Online' : 'Offline'}</span>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-8 relative">
                            <div className="max-w-7xl mx-auto w-full fade-in pb-12">
                                
                                {activeView === 'monitoring' && (
                                    <div className="space-y-6 sm:space-y-8">
                                        <div className="flex items-center gap-3 sm:gap-4 border-b border-borderLight pb-3 sm:pb-4">
                                            <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-blue-50 flex items-center justify-center text-accent"><Icons.Activity/></div>
                                            <div>
                                                <h3 className="text-base sm:text-lg font-bold text-brand">Real-Time Workspace</h3>
                                                <p className="text-[10px] sm:text-xs text-slate-500 font-medium">Monitoring active agent sessions instantly.</p>
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                                            <div className="bg-white p-4 sm:p-6 rounded-xl border border-borderLight shadow-card flex items-center justify-between hover:border-slate-300 transition-colors">
                                                <div>
                                                    <p className="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Users Online</p>
                                                    <p className="text-3xl sm:text-4xl font-extrabold text-brand mono">{onlineUserCount}</p>
                                                </div>
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-blue-50 flex items-center justify-center text-accent"><Icons.Activity/></div>
                                            </div>
                                            <div className="bg-white p-4 sm:p-6 rounded-xl border border-borderLight shadow-card flex items-center justify-between hover:border-slate-300 transition-colors">
                                                <div>
                                                    <p className="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Total Output Today</p>
                                                    <p className="text-3xl sm:text-4xl font-extrabold text-success mono">{totalClosedTodayOnly}</p>
                                                </div>
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-green-50 flex items-center justify-center text-success"><Icons.Table/></div>
                                            </div>
                                        </div>

                                        <div className="flex flex-wrap items-center justify-between gap-2 mt-2 sm:mt-4">
                                            <h3 className="text-base sm:text-lg font-bold text-brand">Users</h3>
                                            <span className="text-[11px] text-slate-500">One card per registered username</span>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                                            {visibleUserGroups.map(group => {
                                                const dev = group.primaryDevice;
                                                if (!dev) return null;
                                                const isBlocked = group.allBlocked;
                                                const isPartiallyBlocked = group.someBlocked && !group.allBlocked;
                                                const isO = group.isOnline;
                                                const groupHas = field => group.deviceIds.some(id => Array.isArray(systemConfig[field]) && systemConfig[field].includes(id));
                                                const groupCount = field => group.deviceIds.filter(id => Array.isArray(systemConfig[field]) && systemConfig[field].includes(id)).length;
                                                const isAutoPilotAuth = groupHas('autoPilotUsers');
                                                const isForceEditAuth = groupHas('forceEditUsers');
                                                const isAddBillAuth = groupHas('addBillUsers');
                                                const isDrsAlertAuth = groupHas('drsAlertUsers');
                                                const isManagePodDateAuth = groupHas('managePodDateUsers');
                                                const isPodAuth = groupHas('podUsers');
                                                const isWafaAuth = groupHas('wafaUsers');
                                                const isBankAuth = groupHas('bankUsers');
                                                const isReturnsAuth = groupHas('returnsUsers');
                                                const chatDevice = group.onlineDevices[0] || dev;
                                                const devChat = messages[chatDevice.id]?.chat || [];
                                                const hasUnread = devChat.length > 0 && devChat[devChat.length-1].from === 'user';
                                                const apDevice = group.devices.find(d => d.apActive) || dev;
                                                const isApActiveNow = !!apDevice.apActive;
                                                const apStats = apDevice.apStats || {rem:0, succ:0, fail:0};

                                                return (
                                                    <div key={group.key} className={`bg-white rounded-xl border p-4 sm:p-5 transition-all shadow-card hover:-translate-y-1 hover:shadow-floating ${isBlocked ? 'border-red-200 bg-red-50/30' : 'border-borderLight hover:border-accent/40'}`}>
                                                        <div className="flex items-center gap-3 sm:gap-4 mb-4 pb-4 border-b border-slate-100">
                                                            <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-50 border border-borderLight flex items-center justify-center text-slate-600 font-bold text-base sm:text-lg shrink-0 shadow-inner-light relative">
                                                                {(group.user || 'U').charAt(0).toUpperCase()}
                                                                {isAutoPilotAuth && <div className="absolute -bottom-1 -right-1 bg-purple-500 text-white rounded-full p-1 shadow-sm"><Icons.Robot/></div>}
                                                            </div>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="font-bold text-brand flex items-center gap-2 truncate text-sm sm:text-base">
                                                                    {group.user}
                                                                    {isO && <span className="w-2 h-2 rounded-full bg-success shrink-0 shadow-[0_0_0_2px_#ecfdf5] pulse-indicator"></span>}
                                                                </div>
                                                                <div className="text-[10px] sm:text-xs text-slate-400 mt-0.5">{group.devices.length} registered device{group.devices.length === 1 ? '' : 's'} · {group.onlineCount} online</div>
                                                                {isPartiallyBlocked && <div className="mt-1 text-[9px] font-bold text-amber-700">Some devices are blocked</div>}
                                                                {isBlocked && <div className="mt-1 text-[9px] font-bold text-red-600">All devices blocked</div>}
                                                            </div>
                                                        </div>
                                                        <div className="space-y-2 sm:space-y-3 mb-4 bg-slate-50/50 p-3 sm:p-4 rounded-lg border border-slate-100">
                                                            <div className="flex justify-between items-center text-xs sm:text-sm"><span className="text-slate-500 font-medium">Current Task</span><span className="font-mono font-bold bg-white border border-slate-200 px-2 py-0.5 rounded shadow-sm text-slate-700">{dev.currentMode||'Idle'}</span></div>
                                                            <div className="flex justify-between items-center text-xs sm:text-sm"><span className="text-slate-500 font-medium">Active AWB</span><span className="font-mono font-bold text-accent">{dev.lastAwb||'-'}</span></div>
                                                            <div className="flex justify-between items-center text-xs sm:text-sm pt-2 sm:pt-3 border-t border-slate-100"><span className="text-slate-500 font-medium">Daily Output</span><span className="font-mono font-extrabold text-success text-base sm:text-lg">{dev.count||0}</span></div>
                                                        </div>

                                                        {isApActiveNow && (
                                                            <div className="mb-4 bg-purple-50 border border-purple-200 p-3 rounded-lg fade-in">
                                                                <div className="flex justify-between items-center mb-2">
                                                                    <span className="text-xs font-bold text-purple-700 flex items-center gap-1.5"><span className="pulse-indicator">🤖</span> Auto-Pilot Running</span>
                                                                    <span className="text-xs font-mono font-bold text-purple-700">{apStats.rem} Left</span>
                                                                </div>
                                                                <div className="flex justify-between text-[10px] font-bold">
                                                                    <span className="text-emerald-600">✅ {apStats.succ} Success</span>
                                                                    <span className="text-red-500">❌ {apStats.fail} Failed</span>
                                                                </div>
                                                            </div>
                                                        )}

                                                        <div className="flex flex-col gap-2">
                                                            <div className="flex gap-2">
                                                                <button onClick={()=>toggleUserBlock(group.deviceIds)} className={`flex-1 py-2.5 rounded-lg text-[10px] sm:text-xs font-bold transition-all border shadow-sm ${isBlocked ? 'bg-white text-success border-green-200 hover:bg-green-50' : 'bg-white text-danger border-red-200 hover:bg-red-50'}`}>
                                                                    {isBlocked ? 'Unblock User' : 'Block User'}
                                                                </button>
                                                                <button onClick={()=>openChat(chatDevice.id, group.user || 'Agent')} className={`flex-1 py-2.5 rounded-lg text-[10px] sm:text-xs font-bold transition-all border shadow-sm flex items-center justify-center gap-1.5 ${hasUnread ? 'bg-accent text-white border-accent hover:bg-accentHover pulse-indicator' : 'bg-white text-accent border-blue-200 hover:bg-blue-50'}`}>
                                                                    <Icons.Chat /> {hasUnread ? 'New Reply!' : 'Chat'}
                                                                </button>
                                                            </div>
                                                            <button onClick={()=>openUserManager(group)} className="w-full py-2.5 rounded-lg text-xs font-bold transition-all border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 flex items-center justify-center gap-2">
                                                                <Icons.Shield/> Manage User · All Devices
                                                            </button>
                                                            <div className="flex flex-wrap gap-1.5 pt-1">
                                                                {isPodAuth && <span title={`POD: ${groupCount('podUsers')}/${group.devices.length} devices`} className="rounded-md border border-blue-100 bg-blue-50 px-2 py-1 text-[9px] font-bold text-blue-700">POD</span>}
                                                                {isWafaAuth && <span title={`Wafa: ${groupCount('wafaUsers')}/${group.devices.length} devices`} className="rounded-md border border-violet-100 bg-violet-50 px-2 py-1 text-[9px] font-bold text-violet-700">Wafa</span>}
                                                                {isBankAuth && <span title={`Bank: ${groupCount('bankUsers')}/${group.devices.length} devices`} className="rounded-md border border-amber-100 bg-amber-50 px-2 py-1 text-[9px] font-bold text-amber-700">Bank</span>}
                                                                {isReturnsAuth && <span title={`Returns: ${groupCount('returnsUsers')}/${group.devices.length} devices`} className="rounded-md border border-emerald-100 bg-emerald-50 px-2 py-1 text-[9px] font-bold text-emerald-700">Returns</span>}
                                                                {isAddBillAuth && <span title={`Add AWB: ${groupCount('addBillUsers')}/${group.devices.length} devices`} className="rounded-md border border-indigo-100 bg-indigo-50 px-2 py-1 text-[9px] font-bold text-indigo-700">Add AWB</span>}
                                                                {isDrsAlertAuth && <span title={`DRS: ${groupCount('drsAlertUsers')}/${group.devices.length} devices`} className="rounded-md border border-teal-100 bg-teal-50 px-2 py-1 text-[9px] font-bold text-teal-700">DRS</span>}
                                                                {isManagePodDateAuth && <span title={`Manage POD Date: ${groupCount('managePodDateUsers')}/${group.devices.length} devices`} className="rounded-md border border-cyan-100 bg-cyan-50 px-2 py-1 text-[9px] font-bold text-cyan-700">POD DATE</span>}
                                                                {isAutoPilotAuth && <span title={`Auto-Pilot: ${groupCount('autoPilotUsers')}/${group.devices.length} devices`} className="rounded-md border border-purple-100 bg-purple-50 px-2 py-1 text-[9px] font-bold text-purple-700">Auto-Pilot</span>}
                                                                {isForceEditAuth && <span title={`Delivered Edit: ${groupCount('forceEditUsers')}/${group.devices.length} devices`} className="rounded-md border border-orange-100 bg-orange-50 px-2 py-1 text-[9px] font-bold text-orange-700">Delivered Edit</span>}
                                                                {!isPodAuth && !isWafaAuth && !isBankAuth && !isReturnsAuth && !isAddBillAuth && !isDrsAlertAuth && !isManagePodDateAuth && !isAutoPilotAuth && !isForceEditAuth && <span className="text-[10px] text-slate-400">No individual permissions granted</span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {visibleUserGroups.length === 0 && (
                                                <div className="col-span-full py-12 sm:py-16 flex flex-col items-center justify-center text-slate-400 bg-white rounded-xl border border-dashed border-borderLight shadow-sm">
                                                    <div className="mb-4 opacity-50"><Icons.Activity /></div>
                                                    <div className="font-semibold text-xs sm:text-sm">No users are currently online or blocked.</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeView === 'permissions' && (
                                    <div className="fade-in">
                                        <div className="mb-5">
                                            <h3 className="text-lg font-extrabold text-brand">User Permissions</h3>
                                            <p className="mt-1 text-xs text-slate-500">Each username appears once. Changes apply to every registered device under that username.</p>
                                        </div>

                                        <div className="grid grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)] gap-4 items-start">
                                            <section className="rounded-xl border border-borderLight bg-white overflow-hidden">
                                                <div className="border-b border-slate-100 p-3">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <div className="text-sm font-bold text-brand">Registered Users</div>
                                                        <span className="text-[10px] text-slate-400">{permissionUserGroups.length} users</span>
                                                    </div>
                                                    <div className="relative">
                                                        <div className="absolute inset-y-0 left-3 flex items-center text-slate-400 pointer-events-none"><Icons.Search/></div>
                                                        <input value={permissionSearch} onChange={e=>setPermissionSearch(e.target.value)} placeholder="Search user or PC ID" className="w-full rounded-lg border border-borderLight bg-surface pl-10 pr-3 py-2.5 text-xs outline-none focus:border-accent focus:bg-white" />
                                                    </div>
                                                </div>
                                                <div className="max-h-[70vh] overflow-y-auto divide-y divide-slate-100">
                                                    {permissionUserGroups
                                                        .filter(group => `${group.user} ${group.deviceIds.join(' ')}`.toLowerCase().includes(permissionSearch.trim().toLowerCase()))
                                                        .map(group => {
                                                            const selected = selectedPermissionUser === group.key;
                                                            return (
                                                                <button key={group.key} onClick={() => selectPermissionUser(group.key)} className={`w-full px-3 py-3 text-left transition-colors ${selected ? 'bg-blue-50 border-l-2 border-l-accent' : 'hover:bg-slate-50 border-l-2 border-l-transparent'}`}>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className={`h-2 w-2 rounded-full shrink-0 ${group.allBlocked ? 'bg-red-500' : group.isOnline ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>
                                                                        <span className="min-w-0 flex-1 truncate text-xs font-bold text-slate-800">{group.user}</span>
                                                                        {group.allBlocked && <span className="text-[9px] font-bold text-red-600">BLOCKED</span>}
                                                                        {group.someBlocked && !group.allBlocked && <span className="text-[9px] font-bold text-amber-700">PARTIAL</span>}
                                                                    </div>
                                                                    <div className="mt-1 pl-4 text-[10px] text-slate-500">{group.deviceIds.length} registered device{group.deviceIds.length === 1 ? '' : 's'}</div>
                                                                    <div className="mt-1 pl-4 text-[9px] font-semibold text-slate-400">{group.allBlocked ? 'Blocked' : group.isOnline ? `${group.onlineCount} online` : 'Offline'}</div>
                                                                </button>
                                                            );
                                                        })}
                                                    {permissionUserGroups.filter(group => `${group.user} ${group.deviceIds.join(' ')}`.toLowerCase().includes(permissionSearch.trim().toLowerCase())).length === 0 && (
                                                        <div className="px-4 py-8 text-center text-xs text-slate-400">
                                                            {permissionUserGroups.length === 0 ? 'No registered devices were returned from Firebase activeDevices.json.' : 'No users match this search.'}
                                                        </div>
                                                    )}
                                                </div>
                                            </section>

                                            <section className="min-w-0 rounded-xl border border-borderLight bg-white overflow-hidden">
                                                {selectedPermissionGroup ? (
                                                    <>
                                                        <div className="border-b border-slate-100 px-4 py-4">
                                                            <div className="flex flex-wrap items-center justify-between gap-3">
                                                                <div className="min-w-0">
                                                                    <div className="text-base font-extrabold text-brand truncate">{selectedPermissionGroup.user}</div>
                                                                    <div className="mt-1 text-[10px] text-slate-500">{selectedPermissionGroup.deviceIds.length} registered device{selectedPermissionGroup.deviceIds.length === 1 ? '' : 's'} · {selectedPermissionGroup.onlineCount} online</div>
                                                                </div>
                                                                <div className="text-[10px] font-semibold text-slate-400">Changes apply to all devices for this username</div>
                                                            </div>
                                                            <details className="mt-3 rounded-lg bg-slate-50 px-3 py-2">
                                                                <summary className="cursor-pointer text-[10px] font-bold text-slate-500">Show linked PC IDs ({selectedPermissionGroup.deviceIds.length})</summary>
                                                                <div className="mt-2 flex flex-wrap gap-1.5">
                                                                    {selectedPermissionGroup.deviceIds.map(id => <span key={id} className="rounded bg-white border border-slate-200 px-2 py-1 text-[10px] font-mono text-slate-500">{id}</span>)}
                                                                </div>
                                                            </details>
                                                        </div>
