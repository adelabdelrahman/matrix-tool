                                                        <div className="p-3 sm:p-4 space-y-3">
                                                            <details open className="group rounded-lg border border-slate-200 overflow-hidden">
                                                                <summary className="flex cursor-pointer list-none items-center justify-between bg-slate-50 px-3 py-3 text-xs font-extrabold text-slate-700">
                                                                    <span>DATA</span><span className="text-[10px] font-medium text-slate-400 group-open:hidden">Show</span><span className="hidden text-[10px] font-medium text-slate-400 group-open:inline">Hide</span>
                                                                </summary>
                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 p-3">
                                                                    <PermissionSwitch label="POD" description="Proof of Delivery" checked={permissionDraft.podUsers} grantedCount={getPermissionGrantCount('podUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('podUsers',v)} />
                                                                    <PermissionSwitch label="Wafa" checked={permissionDraft.wafaUsers} grantedCount={getPermissionGrantCount('wafaUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('wafaUsers',v)} />
                                                                    <PermissionSwitch label="Bank" checked={permissionDraft.bankUsers} grantedCount={getPermissionGrantCount('bankUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('bankUsers',v)} />
                                                                    <PermissionSwitch label="Returns" checked={permissionDraft.returnsUsers} grantedCount={getPermissionGrantCount('returnsUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('returnsUsers',v)} />
                                                                    <PermissionSwitch label="Manage POD Date" description="Open the separate AdminPOD_Manage date bulk updater from MAT Tool" checked={permissionDraft.managePodDateUsers} grantedCount={getPermissionGrantCount('managePodDateUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('managePodDateUsers',v)} />
                                                                </div>
                                                            </details>

                                                            <details className="group rounded-lg border border-slate-200 overflow-hidden">
                                                                <summary className="flex cursor-pointer list-none items-center justify-between bg-slate-50 px-3 py-3 text-xs font-extrabold text-slate-700">
                                                                    <span>ADD AWB</span><span className="text-[10px] font-medium text-slate-400 group-open:hidden">Show</span><span className="hidden text-[10px] font-medium text-slate-400 group-open:inline">Hide</span>
                                                                </summary>
                                                                <div className="p-3">
                                                                    <PermissionSwitch label="Add AWB Access" description="Allows this user to use the Add AWB interface" checked={permissionDraft.addBillUsers} grantedCount={getPermissionGrantCount('addBillUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('addBillUsers',v)} />
                                                                </div>
                                                            </details>

                                                            <details className="group rounded-lg border border-slate-200 overflow-hidden">
                                                                <summary className="flex cursor-pointer list-none items-center justify-between bg-slate-50 px-3 py-3 text-xs font-extrabold text-slate-700">
                                                                    <span>DRS</span><span className="text-[10px] font-medium text-slate-400 group-open:hidden">Show</span><span className="hidden text-[10px] font-medium text-slate-400 group-open:inline">Hide</span>
                                                                </summary>
                                                                <div className="p-3">
                                                                    <PermissionSwitch label="DRS Status Access" description="Allows this user to use DRS Shipment Alert" checked={permissionDraft.drsAlertUsers} grantedCount={getPermissionGrantCount('drsAlertUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('drsAlertUsers',v)} />
                                                                </div>
                                                            </details>

                                                            <details className="group rounded-lg border border-slate-200 overflow-hidden">
                                                                <summary className="flex cursor-pointer list-none items-center justify-between bg-slate-50 px-3 py-3 text-xs font-extrabold text-slate-700">
                                                                    <span>ADVANCED</span><span className="text-[10px] font-medium text-slate-400 group-open:hidden">Show</span><span className="hidden text-[10px] font-medium text-slate-400 group-open:inline">Hide</span>
                                                                </summary>
                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 p-3">
                                                                    <PermissionSwitch label="Auto-Pilot" description="Enable Auto-Pilot for this user" checked={permissionDraft.autoPilotUsers} grantedCount={getPermissionGrantCount('autoPilotUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('autoPilotUsers',v)} />
                                                                    <PermissionSwitch label="Delivered Edit" description="Allow Delivered status editing" checked={permissionDraft.forceEditUsers} grantedCount={getPermissionGrantCount('forceEditUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('forceEditUsers',v)} />
                                                                </div>
                                                            </details>

                                                            <details open className="group rounded-lg border border-violet-200 overflow-hidden">
                                                                <summary className="flex cursor-pointer list-none items-center justify-between bg-violet-50 px-3 py-3 text-xs font-extrabold text-slate-700">
                                                                    <span>MANIFEST</span><span className="text-[10px] font-medium text-violet-500 group-open:hidden">Show</span><span className="hidden text-[10px] font-medium text-violet-500 group-open:inline">Hide</span>
                                                                </summary>
                                                                <div className="p-3">
                                                                    <PermissionSwitch label="Smart Manifest Finder" description="Allow or revoke this user's access to the MANIFEST tool in MAT-TOOL" checked={permissionDraft.manifestUsers} grantedCount={getPermissionGrantCount('manifestUsers', selectedPermissionGroup.deviceIds)} totalCount={selectedPermissionGroup.deviceIds.length} onChange={v=>updatePermissionDraft('manifestUsers',v)} />
                                                                    <p className="mt-2 text-[10px] leading-relaxed text-slate-500">Applies to all registered PC IDs linked to this username. The tool checks this permission before opening and refreshes it periodically.</p>
                                                                </div>
                                                            </details>
                                                        </div>

                                                        <div className="sticky bottom-0 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 bg-white px-4 py-3">
                                                            <span className={`text-[11px] font-semibold ${permissionDirty ? 'text-amber-700' : 'text-slate-400'}`}>{permissionDirty ? 'Unsaved changes' : 'All changes saved'}</span>
                                                            <button onClick={saveSelectedPermissions} disabled={!permissionDirty || isLoading} className={`rounded-lg px-5 py-2.5 text-xs font-bold transition-colors ${permissionDirty && !isLoading ? 'bg-brand text-white hover:bg-brandHover' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}>
                                                                {isLoading ? 'Saving...' : 'Save Permissions'}
                                                            </button>
                                                        </div>
                                                    </>
                                                ) : (
                                                    <div className="flex min-h-[360px] flex-col items-center justify-center px-6 text-center">
                                                        <div className="text-sm font-bold text-slate-600">No user selected</div>
                                                        <p className="mt-2 max-w-sm text-xs text-slate-400">Select a real username from the Firebase activeDevices list. Each user appears once; linked PC IDs are grouped underneath.</p>
                                                    </div>
                                                )}
                                            </section>
                                        </div>
                                    </div>
                                )}

                                {activeView === 'logs' && (
                                    <div className="space-y-4 sm:space-y-6">
                                        <div className="bg-white p-5 rounded-xl border border-borderLight shadow-card transition-all">
                                            <div className="flex flex-col md:flex-row flex-wrap gap-4 items-end">
                                                
                                                <div className="w-full md:flex-1 min-w-[200px]">
                                                    <label className="block text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">User / AWB Search</label>
                                                    <div className="relative group">
                                                        <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400 group-hover:text-accent transition-colors"><Icons.Search/></div>
                                                        <input type="text" placeholder="Search..." value={searchUserAwb} onChange={e=>setSearchUserAwb(e.target.value)} className="w-full bg-surface border border-borderLight rounded-lg pl-10 pr-3 py-2 text-xs sm:text-sm font-mono focus:border-accent focus:outline-none focus:bg-white transition-colors" />
                                                    </div>
                                                </div>
                                                
                                                <div className="w-full md:flex-1 min-w-[150px]">
                                                    <label className="block text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Account No</label>
                                                    <div className="relative group">
                                                        <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400 group-hover:text-accent transition-colors"><Icons.Server/></div>
                                                        <input type="text" placeholder="Acc.No..." value={searchAccNo} onChange={e=>setSearchAccNo(e.target.value)} className="w-full bg-surface border border-borderLight rounded-lg pl-10 pr-3 py-2 text-xs sm:text-sm font-mono focus:border-accent focus:outline-none focus:bg-white transition-colors" />
                                                    </div>
                                                </div>
                                                
                                                <div className="flex gap-4 w-full md:w-auto">
                                                    <div className="w-1/2 md:w-[130px]">
                                                        <label className="block text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">From Date</label>
                                                        <input type="date" value={logFrom} onChange={e=>setLogFrom(e.target.value)} className="w-full bg-surface border border-borderLight rounded-lg px-2 py-2 text-xs sm:text-sm font-mono focus:border-accent focus:outline-none focus:bg-white transition-colors" />
                                                    </div>
                                                    
                                                    <div className="w-1/2 md:w-[130px]">
                                                        <label className="block text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">To Date</label>
                                                        <input type="date" value={logTo} onChange={e=>setLogTo(e.target.value)} className="w-full bg-surface border border-borderLight rounded-lg px-2 py-2 text-xs sm:text-sm font-mono focus:border-accent focus:outline-none focus:bg-white transition-colors" />
                                                    </div>
                                                </div>

                                                <div className="flex gap-2 w-full lg:w-auto shrink-0 mt-2 lg:mt-0">
                                                    <button onClick={showAllLogs} className="flex-1 lg:w-auto px-4 h-[38px] bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-lg transition-colors shadow-sm">Reset</button>
                                                    <button onClick={()=>setShowApOnly(!showApOnly)} title="Show Auto-Pilot Data Only" className={`flex-1 lg:w-auto px-4 h-[38px] flex items-center justify-center gap-1.5 font-bold text-xs rounded-lg transition-colors shadow-sm border ${showApOnly ? 'bg-purple-600 text-white border-purple-700' : 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100'}`}>
                                                        <Icons.Robot /> {showApOnly ? 'Robot Only' : 'Filter Robot'}
                                                    </button>

                                {activeView === 'holidays' && (
                                    <div className="max-w-5xl mx-auto space-y-4 sm:space-y-6 fade-in">
                                        <div className="flex items-center gap-3 sm:gap-4 border-b border-borderLight pb-3 sm:pb-4 mb-3 sm:mb-4">
                                            <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-slate-100 border border-borderLight flex items-center justify-center text-brand"><Icons.Calendar/></div>
                                            <div>
                                                <h3 className="text-base sm:text-lg font-bold text-brand">Operational Calendar</h3>
                                                <p className="text-[10px] sm:text-xs text-slate-500 font-medium">Define skipped dates algorithmically to bypass SLA logic.</p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
                                            <div className="lg:col-span-7 bg-white border border-borderLight rounded-xl shadow-card p-4 sm:p-6 lg:p-8">
                                                <div className="flex justify-between items-center mb-6 sm:mb-8">
                                                    <button onClick={()=>{const d=new Date(calDate); d.setMonth(d.getMonth()-1); setCalDate(d);}} className="p-2 sm:p-2.5 rounded-lg border border-borderLight hover:bg-surface hover:text-accent text-slate-500 transition-colors shadow-sm"><Icons.ChevronLeft/></button>
                                                    <div className="font-bold text-brand text-base sm:text-lg">
                                                        {calDate.toLocaleString('default', { month: 'long' })} {calDate.getFullYear()}
                                                    </div>
                                                    <button onClick={()=>{const d=new Date(calDate); d.setMonth(d.getMonth()+1); setCalDate(d);}} className="p-2 sm:p-2.5 rounded-lg border border-borderLight hover:bg-surface hover:text-accent text-slate-500 transition-colors shadow-sm"><Icons.ChevronRight/></button>
                                                </div>
                                                <div className="grid grid-cols-7 text-center text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-3 sm:mb-4">
                                                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                                                </div>
                                                <div className="grid grid-cols-7 gap-1.5 sm:gap-2">
                                                    {Array.from({length: new Date(calDate.getFullYear(), calDate.getMonth(), 1).getDay()}).map((_, i) => <div key={`empty-${i}`} className="aspect-square"></div>)}
                                                    {Array.from({length: new Date(calDate.getFullYear(), calDate.getMonth() + 1, 0).getDate()}).map((_, i) => {
                                                        const d = i + 1; const m = calDate.getMonth() + 1; const y = calDate.getFullYear();
                                                        const dStr1 = `${d}/${m}/${y}`; const dStr2 = `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
                                                        const isSel = systemConfig.holidays.includes(dStr1) || systemConfig.holidays.includes(dStr2);
                                                        return (
                                                            <div key={d} onClick={()=>toggleDateExclusion(dStr1)} className={`aspect-square flex items-center justify-center rounded-lg sm:rounded-xl font-mono text-xs sm:text-sm cursor-pointer transition-all border-2 shadow-sm ${isSel ? 'bg-brand text-white border-brand font-bold transform scale-105' : 'bg-white text-slate-700 border-borderLight hover:border-accent hover:text-accent font-medium'}`}>
                                                                {d}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            
                                            <div className="lg:col-span-5 bg-white border border-borderLight rounded-xl shadow-card flex flex-col h-[400px] sm:h-[520px]">
                                                <div className="px-4 sm:px-6 py-4 sm:py-5 border-b border-borderLight flex justify-between items-center bg-surface rounded-t-xl shrink-0">
                                                    <span className="text-[10px] sm:text-xs font-bold text-brand uppercase tracking-wider">Active Exclusions</span>
                                                    <span className="bg-white border border-borderLight px-2 sm:px-2.5 py-0.5 rounded text-[10px] sm:text-xs font-bold text-slate-600 shadow-sm">{systemConfig.holidays.length}</span>
                                                </div>
                                                <div className="flex-1 overflow-y-auto p-4 sm:p-5 space-y-2 sm:space-y-2.5 custom-scrollbar bg-surface/30">
                                                    {systemConfig.holidays.length === 0 && <div className="text-center py-10 sm:py-12 text-xs sm:text-sm text-slate-400 font-medium">No operational exclusions defined.</div>}
                                                    {systemConfig.holidays.map(d=>d.replace(/\/+/g, '/').trim()).filter(Boolean).sort((a, b) => { const [d1, m1, y1] = a.split('/').map(Number), [d2, m2, y2] = b.split('/').map(Number); return new Date(y1, m1-1, d1) - new Date(y2, m2-1, d2); }).map(h => {
                                                        const [d, m, y] = h.split('/');
                                                        return (
                                                            <div key={h} className="group flex justify-between items-center bg-white border border-borderLight px-3 sm:px-4 py-2.5 sm:py-3.5 rounded-lg sm:rounded-xl shadow-sm hover:border-accent/40 transition-colors">
                                                                <span className="font-mono text-xs sm:text-sm font-bold text-slate-700 group-hover:text-accent transition-colors">{new Date(y, m-1, d).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' })}</span>
                                                                <button onClick={()=>toggleDateExclusion(h)} className="text-slate-400 hover:text-danger hover:bg-red-50 p-1 sm:p-1.5 rounded-lg transition-colors"><Icons.X /></button>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        </div>
                    </main>

                    {chatModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex justify-center items-center p-3 sm:p-4 fade-in" onClick={(e)=>{if(e.target===e.currentTarget)setChatModal({...chatModal, isOpen:false})}}>
                            <div className="bg-white rounded-2xl w-[95%] sm:w-full max-w-lg shadow-floating border border-borderLight flex flex-col overflow-hidden">
                                <div className="px-4 sm:px-5 py-3 sm:py-4 border-b border-borderLight flex justify-between items-center bg-surface">
                                    <div>
                                        <h3 className="font-bold text-brand text-sm sm:text-base">Dispatch Message</h3>
                                        <div className="text-[10px] sm:text-xs font-medium text-slate-500 mt-0.5">To: <span className="font-bold text-slate-700">{chatModal.targetName}</span></div>
                                    </div>
                                    <div className="flex items-center gap-2 sm:gap-3">
                                        {(messages[chatModal.targetId]?.chat?.length > 0) && (
                                            <button onClick={clearChatHistory} className="flex items-center gap-1 sm:gap-1.5 text-[10px] sm:text-xs font-bold text-danger bg-red-50 hover:bg-red-100 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg transition-colors border border-red-200">
                                                <Icons.Trash /> <span className="hidden sm:inline">Clear Chat</span>
                                            </button>
                                        )}
                                        <button onClick={()=>setChatModal({...chatModal, isOpen:false})} className="p-1 sm:p-1.5 rounded-md text-slate-400 hover:text-danger hover:bg-red-50 transition-colors"><Icons.X/></button>
                                    </div>
                                </div>
                                <div ref={chatBoxRef} className="p-4 sm:p-5 h-[300px] sm:h-[350px] overflow-y-auto flex flex-col gap-2 sm:gap-3 custom-scrollbar">
                                    {(messages[chatModal.targetId]?.chat || []).map((c, i) => {
                                        const isAdmin = c.from === 'admin';
                                        return (
                                            <div key={i} className={`max-w-[85%] rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm shadow-sm border ${isAdmin ? 'self-end bg-accent text-white border-accentHover rounded-br-none' : 'self-start bg-surface text-brand border-borderLight rounded-bl-none'}`}>
                                                <div className="break-words leading-relaxed font-medium">{c.msg}</div>
                                                <div className={`text-[9px] sm:text-[10px] font-bold mt-1 sm:mt-1.5 text-right ${isAdmin ? 'text-blue-200' : 'text-slate-400'}`}>{new Date(c.ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                                            </div>
                                        )
                                    })}
                                    {(!messages[chatModal.targetId]?.chat || messages[chatModal.targetId].chat.length === 0) && <div className="m-auto text-xs sm:text-sm text-slate-400 font-medium">Start conversation...</div>}
                                </div>
                                <div className="p-3 sm:p-4 bg-white border-t border-borderLight flex gap-2">
                                    <input type="text" value={chatModal.text} onChange={e=>setChatModal({...chatModal, text: e.target.value})} onKeyDown={e=>{if(e.key==='Enter') sendDirectMessage()}} placeholder="Type response..." className="flex-1 bg-surface border border-borderLight rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-accent transition-colors shadow-inner-light" autoFocus />
                                    <button onClick={sendDirectMessage} className="bg-brand hover:bg-brandHover text-white px-4 sm:px-6 rounded-lg font-bold text-xs sm:text-sm transition-colors shadow-sm">Send</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
